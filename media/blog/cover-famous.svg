<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs>
<radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0" stop-color="#0d1a3a"/><stop offset=".6" stop-color="#060c1b"/><stop offset="1" stop-color="#04070d"/></radialGradient>
